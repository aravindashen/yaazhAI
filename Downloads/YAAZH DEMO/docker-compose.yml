version: '3.8'

services:
  yaazh-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yaazh-ai-core
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./yaazh_corpus.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-yaazh-secret-2026}
    volumes:
      - ./backend:/app/backend
      - yaazh-data:/app/data
    restart: unless-stopped

volumes:
  yaazh-data:
